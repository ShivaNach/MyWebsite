.btn {
padding:2px;
height:35px;
width:290px;
font-size:18px;
font-family:'Ubuntu',sans-serif;
background:#add8e6;
margin:15px;
border:3px solid blue;
box-sizing:border-box;
border-radius:10px;
cursor:pointer;
transition:0.5s all;
overflow:hidden;
}
.btn:before{
content:'';
position:absolute;
top:0;
left:0;
width:50%;
height:100%;
background:grey;
z-index:-1;
transform:scaleX(0);
transition:transform 0.5s;
transform-origin:right;
}
.btn:after{
content:'';
position:absolute;
top:0;
right:0;
width:50%;
height:100%;
background:grey;
z-index:-1;
transform:scaleX(0);
transition:transform 0.5s;
transform-origin:left;
}
.btn:hover{
border:3px solid black;
transform:translateX(0);
color:white;
}
.btn:hover:before{
transform:scaleX(1);
transition:transform 0.5s;
transform-origin:left;
}
.btn:hover:after{
transform:scaleX(1);
transition:transform 0.5s;
transform-origin:right;
}
.send {
padding:2px;

.send:hover{

  color:white;

.floating-label {
  position:relative;
}
.floating-email{
height:40px;
width:250px;
left:40%;
box-shadow: 10px 6px 0px 0px #7569E8;
padding-top:10px;
padding:5px;
border-radius: 5px;
padding:0.75px;
border: 2px solid black;
position:relative;
}
.floating-email:invalid{
  border:2px ridge red;
}
.floating-email:focus{
  border:2px solid green;
  transition:all 0.2s ease-out;
}
.el {
  color:#999;
  font-size:14px;
  font-weight:normal;
  position:absolute;
  pointer-events:none;
  left:44%;
  font-family:FontAwesome,'Ubuntu',sans-serif;
  top:12px;
  transition:0.2s ease all;
  -moz-transition:0.2s ease all;
  -webkit-transition:0.2s ease all;
}
.floating-email:hover, .floating-textarea:hover{
  border:2px solid blue;
}
.floating-email:focus ~ .el, .floating-email:not(:placeholder-shown) ~ .el{
  transform:translateY(-20px);
  font-size:14px;
  box-sizing: border-box;
  border:2px solid #fff;
  background:#fff;
}
.floating-email:focus ~ .bar:before, .floating-email:focus ~ .bar:after{
  width:30%;
}

*, *:before, *:after {
    -webkit-box-sizing: border-box;
    -moz-box-sizing: border-box;
    box-sizing: border-box;
}

.floating-textarea {

.highlight {

  width:100%;
  top:15%;
  left:0;
  pointer-events:none;
  opacity:0.5;
}
.floating-input:focus ~ .highlight{

  -moz-animation:inputHighlighter 0.3s ease;

}
.floating-textarea:focus{

.ml{

}
.floating-textarea:focus ~ .ml, .floating-textarea:not(:placeholder-shown) ~ .ml {

  font-size:20px;
  box-sizing: border-box;
  border:2px solid #fff;
  background:#fff;
}
.floating-textarea:focus ~ .bar:before, .floating-textarea:focus ~ .bar:after{
  width:50%;
}
.rt{
  color: red;
  font-size:15px;
  display:none;
  font-family:'Ubuntu',sans-serif;

}
.stick{

top:0;

 .loader{

}
.loader > img{

}
.loader.hidden{

}
@keyframes fadeOut{

  100%{

    visibility:hidden;
  }
}
