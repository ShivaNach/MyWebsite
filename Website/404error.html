@import url('https://fonts.googleapis.com/css?family=Montserrat:800|Ubuntu&display=swap');
*{
  scrollbar-color:#555 transparent;
  scrollbar-width: thin;
}
::-webkit-scrollbar {

}
::-webkit-scrollbar-track {

}

h1{

body{
	background:url('404 banner.svg'), no-repeat;

}
.social-icons{
	position:fixed;
	top:65%;
	left:0;
	z-index: 81;
}
.social-icons li{
	list-style: none;
	transform:translateX(-39px);
}
.social-icons li i{
	transition:0.5s;
}
.social-icons li i:hover{
	width:160px;
	padding-left:60px;
	color:black;
}
.social-icons li .fa-youtube{
	box-sizing: border-box;
	height:50px;
	width:80px;
	padding-top:11px;
	padding-left:20px;
	font-size: 30px;
	color:white;
	background:red;
}
.social-icons li .fa-reddit-alien{
	box-sizing: border-box;
	height:50px;
	width:80px;
	padding-top:11px;
	padding-left:20px;
	font-size: 30px;
	color:white;
	background:#FF2828;
}
.social-icons li .fa-pinterest-p{
  box-sizing: border-box;
  height:50px;
  width:80px;
  padding-top:11px;
  padding-left:20px;
  font-size: 30px;
  color:white;
  background:#FF0000;
}
.social-icons li .fa-instagram{
	box-sizing:border-box;
	height:50px;
	width:80px;
	padding-top:11px;
	padding-left:20px;
	font-size: 30px;
	color:white;
	background:linear-gradient(to right,orange,purple);
}
.loader{
	position:fixed;
	z-index: 99;
	top:0;
	left:0;
	width:100%;
	height:100%;
	background:white;
	display:flex;
	justify-content:center;
	align-items:center;
}
.loader > img{
	width:100px;
}
.loader.hidden{
	animation:fadeOut 5s;
	animation-fill-mode:forwards;

}
@keyframes fadeOut{

	100%{
		opacity:0;
		visibility:hidden;
	}
}
p{
	margin-left:50%;
	font-family:'Montserrat';
	font-size:6em;

	color:#FF5858;
}
.hombtn{
	margin-left:65%;
	height:4em;
	width:12em;
	text-decoration:none;
	padding:13px 10px 13px 10px;
	background: linear-gradient(90deg,#0612c8,#55e7fc);
	color:white;
	overflow:hidden;
	transition:0.5s all;
	box-sizing:border-box;
	cursor:pointer;
	font-family:'Montserrat';
	transform:translate(0,0);
	text-transform:uppercase;
	font-size:2em;
	border:3px solid black;
	border-radius:40px;
}
.hombtn:after{
content:'';
position:absolute;
top:0;
right:0;
width:50%;
height:300%;
background:linear-gradient(90deg,#0612c8,#5587fc);
z-index:-1;
transform:scaleX(0);
transition:transform 0.5s;
transform-origin:left;
}
.hombtn:hover{
border:none;
color:#BCEAF7;
transition:0.5s;
}
.hombtn span {
  cursor: pointer;
  display: inline-block;
  position: relative;
  transition: 0.5s;
}

.hombtn span:after {
  content: '\00bb';
  position: absolute;
  opacity: 0;
  top: 0;
  right: -20px;
  transition: 0.5s;
}

.hombtn:hover span {
  padding-right: 25px;
}

.hombtn:hover span:after {
  opacity: 1;
  right: 0;
}
.hombtn:hover:after{
transform:scaleX(1);
transition:transform 0.5s;
transform-origin:right;
}
@media only screen and (max-width: 480px) {
  .social-icons{
    display:none;
