<style>
@import url('https://fonts.googleapis.com/css?family=Montserrat:800|Ubuntu&display=swap');
*{
  scrollbar-color:#555 transparent;
  scrollbar-width: thin;
}
::-webkit-scrollbar {
  width: 7.5px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: #888;
  border-radius:30px;
}
::-webkit-scrollbar-thumb:hover {
  background: #555; 
}
*::selection{
	background:#7659e8;
	color:white;
}
.social-icons{
	position:fixed;
	top:65%;
	left:0;
	z-index: 81;
}
.social-icons li{
	list-style: none;
	transform:translateX(-39px);
}
.social-icons li i{
	transition:0.5s;
}
.social-icons li i:hover{
	width:160px;
	padding-left:60px;
	color:black;
}
.social-icons li .fa-youtube{
	box-sizing: border-box;
	height:50px;
	width:80px;
	padding-top:11px;
	padding-left:20px;
	font-size: 30px;
	color:white;
	background:red;
}
.social-icons li .fa-reddit-alien{
	box-sizing: border-box;
	height:50px;
	width:80px;
	padding-top:11px;
	padding-left:20px;
	font-size: 30px;
	color:white;
	background:#FF2828;
}
.social-icons li .fa-pinterest-p{
  box-sizing: border-box;
  height:50px;
  width:80px;
  padding-top:11px;
  padding-left:20px;
  font-size: 30px;
  color:white;
  background:#FF0000;
}
.social-icons li .fa-instagram{
	box-sizing:border-box;
	height:50px;
	width:80px;
	padding-top:11px;
	padding-left:20px;
	font-size: 30px;
	color:white;
	background:linear-gradient(to right,orange,purple);
}
.btn {
padding:2px;
height:35px;
width:290px;
font-size:18px;
font-family:'Ubuntu',sans-serif;
background:#add8e6;
margin:15px;
border:3px solid blue;
box-sizing:border-box;
border-radius:10px;
cursor:pointer;
transition:0.5s all;
overflow:hidden;
}
.btn:before{
content:'';
position:absolute;
top:0;
left:0;
width:50%;
height:100%;
background:grey;
z-index:-1;
transform:scaleX(0);
transition:transform 0.5s;
transform-origin:right;
}
.btn:after{
content:'';
position:absolute;
top:0;
right:0;
width:50%;
height:100%;
background:grey;
z-index:-1;
transform:scaleX(0);
transition:transform 0.5s;
transform-origin:left;
}
.btn:hover{
border:3px solid black;
transform:translateX(0);
color:white;
}
.btn:hover:before{
transform:scaleX(1);
transition:transform 0.5s;
transform-origin:left;
}
.btn:hover:after{
transform:scaleX(1);
transition:transform 0.5s;
transform-origin:right;	
}
.loader{
	position:fixed;
	z-index: 99;
	top:0;
	left:0;
	width:100%;
	height:100%;
	background:white;
	display:flex;
	justify-content:center;
	align-items:center;
}
.loader > img{
	width:100px;
}
.loader.hidden{
	animation:fadeOut 5s;
	animation-fill-mode:forwards;

}
@keyframes fadeOut{

	100%{
		opacity:0;
		visibility:hidden;
	}
}
.stick{
	position:sticky;
	top:0;
	box-sizing: border-box;
	border:1px solid transparent;
	background:#91c9cf;
	z-index: 90;
}
h1{
	display:flex;
	justify-content: center;
	background-size: cover;
     background-image: url('eventimg.png');
     background-position: center;
     text-align: center;
     -webkit-background-clip: text;
     -webkit-text-fill-color: transparent;
     font-size:60px;
     user-select: none;
     text-transform: uppercase;
     font-family: 'Montserrat';
     margin:10px;
     transition:0.5s;
}
table{
	font-family:'Ubuntu',sans-serif;
	font-size:22px;
}
@media only screen and (max-width:480px) {
	.social-icons{
		display:none;
	}
	.stick{
		width:100%;
	}
	table{
		width:100%;
	}
	h1{
		margin-left:-8px;
		font-size:20px;
	}
}
@media only screen and (min-width:481px) and (max-width: 900px) {
	.social-icons{
		display:none;
	}
	h1{
		font-size:35px;
	}
	.stick{
		width:100%;
	}
	table{
		width:100%;
	}
}
</style>
